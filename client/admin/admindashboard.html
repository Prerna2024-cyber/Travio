<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Travio Admin Dashboard</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-gray-100">

<div class="flex min-h-screen">

  <!-- ================= SIDEBAR ================= -->
  <aside class="w-64 bg-white shadow-lg p-4 space-y-4">
    <h2 class="text-2xl font-bold mb-6">Travio</h2>

    <button onclick="showDashboard()" class="sidebar-btn">📊 Dashboard</button>
    <button onclick="loadRides('cab')" class="sidebar-btn">🚕 Cab Rides</button>
    <button onclick="loadRides('travelBuddy')" class="sidebar-btn">🤝 Travel Buddy</button>
    <button onclick="loadUsers()" class="sidebar-btn">👥 Users</button>
    <button onclick="loadAdmins()" class="sidebar-btn">🛡 Admins</button>
    <button onclick="showSection('createAdmin')" class="sidebar-btn">➕ Create Admin</button>

    <button onclick="logout()" class="text-red-500 mt-10">Logout</button>
  </aside>

  <!-- ================= MAIN ================= -->
  <main class="flex-1 p-6 space-y-8">

    <!-- DASHBOARD -->
    <section id="dashboard">
      <h1 class="text-2xl font-semibold mb-4">Dashboard</h1>

      <div class="grid grid-cols-4 gap-4 mb-6">
        <div class="stat-card">Scheduled<br><span id="scheduledCount">0</span></div>
        <div class="stat-card">Ongoing<br><span id="ongoingCount">0</span></div>
        <div class="stat-card">Completed<br><span id="completedCount">0</span></div>
        <div class="stat-card">Cancelled<br><span id="cancelledCount">0</span></div>
      </div>

      <div class="bg-white p-6 rounded shadow">
        <canvas id="rideChart"></canvas>
      </div>
    </section>

    <!-- RIDES -->
    <section id="ridesSection" class="hidden">
      <h2 class="text-xl font-semibold mb-4">Rides</h2>
      <div class="bg-white rounded shadow overflow-x-auto">
        <table class="w-full">
          <thead class="bg-gray-200">
            <tr>
              <th class="p-3">From → To</th>
              <th class="p-3">Type</th>
              <th class="p-3">Status</th>
              <th class="p-3">Participants</th>
              <th class="p-3">Action</th>
            </tr>
          </thead>
          <tbody id="ridesTable"></tbody>
        </table>
      </div>
    </section>

    <!-- USERS -->
    <section id="usersSection" class="hidden">
      <h2 class="text-xl font-semibold mb-4">Users</h2>
      <div class="bg-white rounded shadow overflow-x-auto">
        <table class="w-full">
          <thead class="bg-gray-200">
            <tr>
              <th class="p-3">Name</th>
              <th class="p-3">College ID</th>
              <th class="p-3">Email</th>
              <th class="p-3">Action</th>
            </tr>
          </thead>
          <tbody id="usersTable"></tbody>
        </table>
      </div>
    </section>

    <!-- ADMINS -->
    <section id="adminsSection" class="hidden">
      <h2 class="text-xl font-semibold mb-4">Admins</h2>
      <div class="bg-white rounded shadow overflow-x-auto">
        <table class="w-full">
          <thead class="bg-gray-200">
            <tr>
              <th class="p-3">Name</th>
              <th class="p-3">Email</th>
              <th class="p-3">Created At</th>
              <th class="p-3">Last Login</th>
            </tr>
          </thead>
          <tbody id="adminsTable"></tbody>
        </table>
      </div>
    </section>

    <!-- CREATE ADMIN -->
    <section id="createAdmin" class="hidden bg-white p-6 rounded shadow">
      <h2 class="text-xl font-semibold mb-4">Create Admin</h2>

      <form id="adminForm" class="grid grid-cols-3 gap-4">
        <input id="name" placeholder="Name" class="border p-2 rounded" required />
        <input id="email" type="email" placeholder="Email" class="border p-2 rounded" required />
        <input id="Password" type="password" placeholder="Password" class="border p-2 rounded" required />
        <button class="col-span-3 bg-black text-white py-2 rounded">Create</button>
      </form>

      <p id="adminMsg" class="mt-2 text-green-600"></p>
    </section>

  </main>
</div>

<style>
.sidebar-btn {
  display: block;
  width: 100%;
  text-align: left;
  padding: 8px;
  border-radius: 6px;
}
.sidebar-btn:hover { background: #f3f4f6; }
.stat-card {
  background: white;
  padding: 16px;
  border-radius: 8px;
  text-align: center;
  font-weight: bold;
}
</style>

<script>
function showSection(id) {
  document.querySelectorAll("main section").forEach(s => s.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}
function showDashboard() { showSection("dashboard"); }

/* ================= AUTH ================= */
async function checkAdmin() {
  const res = await fetch("/api/admin/dashboard", { credentials: "include" });
  if (res.status === 401 || res.status === 403) {
    window.location.href = "/admin/adminlogin.html";
  }
}

/* ================= STATS ================= */
async function loadStats() {
  const res = await fetch("/api/admin/rides", { credentials: "include" });
  const rides = await res.json();

  const stats = { scheduled: 0, ongoing: 0, completed: 0, cancelled: 0 };
  rides.forEach(r => stats[r.status]++);

  scheduledCount.innerText = stats.scheduled;
  ongoingCount.innerText = stats.ongoing;
  completedCount.innerText = stats.completed;
  cancelledCount.innerText = stats.cancelled;

  new Chart(rideChart, {
    type: "bar",
    data: {
      labels: Object.keys(stats),
      datasets: [{ label: "Rides", data: Object.values(stats) }]
    }
  });
}

/* ================= RIDES ================= */
async function loadRides(type) {
  showSection("ridesSection");
  const rides = await fetch("/api/admin/rides", { credentials: "include" }).then(r => r.json());
  const filtered = rides.filter(r => r.rideType === type);

  ridesTable.innerHTML = filtered.map(r => `
    <tr class="border-t">
      <td class="p-3">${r.pickup.name} → ${r.destination.name}</td>
      <td class="p-3">${r.rideType}</td>
      <td class="p-3">${r.status}</td>
      <td class="p-3">${r.participants.length}</td>
      <td class="p-3">
        <button onclick="deleteRide('${r._id}')" class="text-red-500">Delete</button>
      </td>
    </tr>
  `).join("");
}

/* ================= USERS ================= */
async function loadUsers() {
  showSection("usersSection");
  const users = await fetch("/api/admin/users", { credentials: "include" }).then(r => r.json());

  usersTable.innerHTML = users.map(u => `
    <tr class="border-t">
      <td class="p-3">${u.name}</td>
      <td class="p-3">${u.collegeId}</td>
      <td class="p-3">${u.email}</td>
      <td class="p-3">
        <button onclick="deleteUser('${u._id}')" class="text-red-500">Delete</button>
      </td>
    </tr>
  `).join("");
}

async function deleteUser(id) {
  if (!confirm("Delete this user?")) return;
  await fetch(`/api/admin/users/${id}`, { method: "DELETE", credentials: "include" });
  loadUsers();
}

/* ================= ADMINS ================= */
async function loadAdmins() {
  showSection("adminsSection");
  const admins = await fetch("/api/admin/admins", { credentials: "include" }).then(r => r.json());

  adminsTable.innerHTML = admins.map(a => `
    <tr class="border-t">
      <td class="p-3">${a.name}</td>
      <td class="p-3">${a.email}</td>
      <td class="p-3">${new Date(a.createdAt).toLocaleString()}</td>
      <td class="p-3">${a.lastLogin ? new Date(a.lastLogin).toLocaleString() : "Never"}</td>
    </tr>
  `).join("");
}

/* ================= CREATE ADMIN ================= */
adminForm.addEventListener("submit", async e => {
  e.preventDefault();
  const res = await fetch("/api/admin/signup", {
    method: "POST",
    credentials: "include",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name: name.value, email: email.value, Password: Password.value })
  });
  const data = await res.json();
  adminMsg.innerText = data.message;
});

/* ================= LOGOUT ================= */
function logout() {
  fetch("/api/admin/logout", { credentials: "include" });
  window.location.href = "/admin/adminlogin.html";
}

/* ================= INIT ================= */
checkAdmin();
loadStats();
</script>

</body>
</html>
