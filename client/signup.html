<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup - Travio</title>
  <style>
    /* 1. Core Layout - Matching your Login Screen */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #FFE5B4 0%, #FFDAA9 50%, #FFC98D 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden; /* Only prevent horizontal scroll */
      position: relative;
    }

    /* 2. Background Decorations (Trees, Sun, Building) */
    .bg-decoration { position: absolute; opacity: 0.35; z-index: 1; }
    .sun { top: 10%; right: 10%; width: 80px; height: 80px; background: #FFD700; border-radius: 50%; box-shadow: 0 0 40px rgba(255, 215, 0, 0.5); }
    .tree { position: absolute; bottom: 15%; width: 100px; opacity: 0.4; z-index: 1; }
    .tree-left { left: 10%; }
    .tree-right { right: 10%; }

    /* 3. Header Styling */
    .header {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 15px 40px;
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(5px);
      z-index: 1000;
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-img { width: 40px; height: 40px; background: #FF8C00; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .logo-text h1 { color: #FF6B35; font-size: 24px; margin: 0; }
    .logo-text p { color: #666; font-size: 10px; text-transform: uppercase; margin: 0; }

    /* 4. Signup Card - The "Glass" Container */
    .signup-card {
      background: white;
      border-radius: 24px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.1);
      padding: 35px 45px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh; /* Allow more height for content */
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 100;
      animation: fadeIn 0.6s ease-out;
      overflow: hidden; /* Contain content within card */
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .signup-header { text-align: center; margin-bottom: 25px; }
    .signup-header h2 { color: #333; font-size: 20px; font-weight: 700; }
    .signup-header p { color: #777; font-size: 10px; margin-top: 5px; }

    /* 5. Scrollable Form Area */
    .form-content {
      flex: 1;
      overflow-y: auto;
      padding-right: 12px; /* Space for scrollbar */
      margin-bottom: 20px;
    }

    /* Scrollbar styling to match theme */
    .form-content::-webkit-scrollbar { width: 5px; }
    .form-content::-webkit-scrollbar-track { background: #f1f1f1; }
    .form-content::-webkit-scrollbar-thumb { background: #FFC98D; border-radius: 10px; }

    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; color: #444; font-weight: 600; font-size: 13px; margin-bottom: 6px; }
    
    .input-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-box span {
      position: absolute;
      left: 15px;
      font-size: 13px;
      color: #FF8C00;
    }

    .form-group input {
      width: 100%;
      padding: 12px 15px 12px 45px;
      border: 1.5px solid #eee;
      border-radius: 12px;
      background: #fdfdfd;
      font-size: 12px;
      transition: all 0.3s;
    }

    .form-group input:focus {
      border-color: #FF8C00;
      background: #fff;
      outline: none;
      box-shadow: 0 0 0 4px rgba(255, 140, 0, 0.1);
    }

    /* 6. Buttons & Links */
    .signup-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #FF8C00, #FF6B35);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 107, 53, 0.3);
      transition: transform 0.2s;
    }

    .signup-btn:hover { transform: translateY(-2px); }

    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #666;
    }

    .login-footer a { color: #FF8C00; text-decoration: none; font-weight: 700; }

    /* 7. Form Flex Layout */
    form {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0; /* Important for flex child to respect overflow */
    }

  </style>
</head>
<body>

  <header class="header">
    <div class="logo">
      <div class="logo-img">🚗</div>
      <div class="logo-text">
        <h1>Travio</h1>
        <p>Banasthali Vidyapith</p>
      </div>
    </div>
  </header>

  <div class="bg-decoration sun"></div>
  <div class="bg-decoration tree tree-left">🌳</div>
  <div class="bg-decoration tree tree-right">🌳</div>

  <div class="signup-card">
    <div class="signup-header">
      <h2>Create Account</h2>
      <p>Join the travel community</p>
    </div>

    <form id="signupForm" >
      <div class="form-content">
        
        <div class="form-group">
          <label>College ID</label>
          <div class="input-box">
            <span>🆔</span>
            <input type="text" id="collegeId" placeholder="Enter College ID" required>
          </div>
        </div>

        <div class="form-group">
          <label>Full Name</label>
          <div class="input-box">
            <span>👤</span>
            <input type="text" id="name" placeholder="Enter your name" required>
          </div>
        </div>

        <div class="form-group">
          <label>Contact Number</label>
          <div class="input-box">
            <span>📞</span>
            <input type="tel" id="contactNumber" placeholder="Your mobile number" required>
          </div>
        </div>

        <div class="form-group">
          <label>Guardian Number</label>
          <div class="input-box">
            <span>👨‍👩‍👧</span>
            <input type="tel" id="guardianNumber" placeholder="Emergency contact">
          </div>
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <div class="input-box">
            <span>📧</span>
            <input type="email" id="email" placeholder="abc@gmail.com" required>
          </div>
        </div>

        <div class="form-group">
          <label>Course</label>
          <div class="input-box">
            <span>🎓</span>
            <input type="text" id="course" placeholder="e.g. B.Tech CS" required>
          </div>
        </div>

        <div class="form-group">
          <label>Profile Picture</label>
          <div class="input-box">
            <span>🖼️</span>
            <input type="text" id="profilePicture" placeholder="Profile picture URL (optional)">
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="input-box">
            <span>🔒</span>
            <input type="password" id="password" placeholder="Create a password" required>
          </div>
        </div>

      </div>

      <button type="submit" class="signup-btn">Create Account</button>
    </form>

    <div class="login-footer">
      Already have an account? <a href="login.html">Login</a>
    </div>
  </div>

  <script src="user/signup.js"></script>
</body>
</html>
